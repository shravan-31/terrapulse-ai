[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    unit: Pure unit tests (no external services)
    integration: Tests requiring real DB/Redis/filesystem
    api: FastAPI endpoint tests (uses AsyncClient)
    geo: Geospatial / rasterio tests
    ml: ML model tests (may require checkpoints)
    faiss: FAISS index tests
    slow: Slow tests (>5 s)
    network: Tests that call live external services (Copernicus, Groq)
    gpu: Tests requiring a CUDA device
