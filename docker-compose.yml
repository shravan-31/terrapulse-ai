version: "3.9"

# SatQuery AI — Docker Compose
# Phase 0 scaffold: PostGIS + Redis with health checks; stubs for backend, worker, frontend.
# CPU profile first; GPU profile in docs/runbooks/gpu_deployment.md.
# Production: use Nginx with TLS termination; see docs/runbooks/install.md.

services:

  # -------------------------------------------------------------------------
  # PostgreSQL + PostGIS
  # -------------------------------------------------------------------------
  postgis:
    image: postgis/postgis:15-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-satquery}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-satquery}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Non-root: postgis image already runs as postgres user (uid 70)

  # -------------------------------------------------------------------------
  # Redis
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------------------
  # Backend API (stub — Phase 1 replaces with real FastAPI app)
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB:-satquery}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./indexes:/app/indexes
      - ./reports:/app/reports
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Controlled deployment: migrations run via dedicated one-off service
    # Do not execute migrations inside API replicas to avoid race conditions.

  # -------------------------------------------------------------------------
  # Controlled Database Migration (one-off execution, prevents race conditions)
  # Run explicitly: docker compose run --rm migration
  # -------------------------------------------------------------------------
  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgis:
        condition: service_healthy
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB:-satquery}
    profiles:
      - tools
      - migration

  # -------------------------------------------------------------------------
  # Celery Worker (stub — Phase 3 adds real tasks)
  # -------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=${WORKER_CONCURRENCY:-1}"]
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB:-satquery}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./indexes:/app/indexes
      - ./reports:/app/reports

  # -------------------------------------------------------------------------
  # Frontend (stub — Phase 2 adds real Vite app)
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------------------
  # Nginx reverse proxy (production TLS termination)
  # In development: omit or replace with direct access to ports above.
  # TLS certificates: mount into /etc/nginx/certs/
  # See docs/runbooks/install.md for TLS setup.
  # -------------------------------------------------------------------------
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   depends_on:
  #     - backend
  #     - frontend
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   ports:
  #     - "80:80"
  #     - "443:443"

volumes:
  postgis_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: satquery_net
